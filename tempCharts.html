<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>24-Hour Temperature Comparison</title>
  <link rel="stylesheet" href="styles/tempChartstyle.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/frappe-charts@latest/dist/frappe-charts.min.umd.js"></script>
</head>
<body>
    <header>
  <div class="unit-selector">
    <div class="btn-group" role="group" aria-label="Unit selector">
      <input type="radio" class="btn-check" name="unit" id="metric" autocomplete="off" checked>
      <label class="btn btn-outline-primary btn-sm" for="metric">°C</label>

      <input type="radio" class="btn-check" name="unit" id="imperial" autocomplete="off">
      <label class="btn btn-outline-primary btn-sm" for="imperial">°F</label>

      <input type="radio" class="btn-check" name="unit" id="standard" autocomplete="off">
      <label class="btn btn-outline-primary btn-sm" for="standard">K</label>
    </div>
  </div>
</header>
  <h2 class="title">OpenWeather vs Open-Meteo</h2>

  <div id="chart"></div>

  <button id="navigation" class="btn btn-secondary mt-3" onclick="window.location.href='index.html'">
  Back to Main Page
</button>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/tempCharts.js"></script>
</body>
</html>
