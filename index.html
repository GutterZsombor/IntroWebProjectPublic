<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/frappe-charts@latest/dist/frappe-charts.min.umd.js"></script>

    
    <link rel="stylesheet" href="styles/indexstyle.css">
</head>
<body >

  <header>
  <h1 class="fw-bold text-primary">Weather App</h1>

  <div class="headerMenu">
    <div class="searchField">
      <input type="text" id="cityInput" class="form-control w-50 me-2" placeholder="Enter city name...">
      <button id="searchBtn" class="btn btn-primary">Search</button>
    </div>

    <div class="secondButtons">
      <button id="locateBtn" class="btn btn-outline-secondary">Use My Location</button>
      <button id="compareBtn" class="btn btn-outline-secondary" onclick="window.location.href='tempCharts.html'">
        Compare Forecasts
      </button>

      <div class="dropdown">
        <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="preDrop"
          data-bs-toggle="dropdown" aria-expanded="false">
          Previous
        </button>
        <ul class="dropdown-menu" id="preList">
          <li><a class="dropdown-item" href="#">--</a></li>
        </ul>
      </div>
    </div>
  </div>

  <div class="unit-selector">
    <div class="btn-group" role="group" aria-label="Unit selector">
      <input type="radio" class="btn-check" name="unit" id="metric" autocomplete="off" checked>
      <label class="btn btn-outline-primary btn-sm" for="metric">°C</label>

      <input type="radio" class="btn-check" name="unit" id="imperial" autocomplete="off">
      <label class="btn btn-outline-primary btn-sm" for="imperial">°F</label>

      <input type="radio" class="btn-check" name="unit" id="standard" autocomplete="off">
      <label class="btn btn-outline-primary btn-sm" for="standard">K</label>
    </div>
  </div>
</header>

    <main>
   
    <div class="container text-center my-4">
        <h4 class="fw-semibold text-secondary mb-3">Current</h4>
        <div  class="d-flex justify-content-center">
            <div id="weathercad" class="card shadow-lg p-3 mb-5 rounded" style="width: 22rem;">
                <div class="card-body text-center">
                    <h2 id="locName" class="card-title fw-semibold">--</h2>
                    <p id="dateTime" class="text-muted small">--</p>
                    <img id="iconW" src="" alt="Weather icon" class="my-2" width="100">
                    <h3 id="temperature" class="display-5 fw-bold text-primary">--°C</h3>
                    <p id="description" class="text-capitalize">--</p>
                    <div class="d-flex justify-content-around mt-3">
                        <p id="humidity" class="mb-0">--%</p>
                        <p id="wind" class="mb-0">-- m/s</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <div class="container text-center mb-5">
        <h4 class="fw-semibold text-secondary mb-3">Next 24 Hours</h4>
        <section id="forecastsection">
            <div id="forecast" class="d-flex flex-wrap justify-content-center gap-3">
                
               
            </div>
        </section>
    </div>
      <div id="chart"></div>
</main>


   
     <footer class="text-center ">
        <h6 class="fw-semibold">Weather Data Sources</h6>
         <p >
             <a href="https://openweathermap.org/" target="_blank" class="badge bg-primary"> OpenWeatherMap API</a>
        
             <a href="https://openweathermap.org/" target="_blank" class="badge bg-primary">Open-Meteo API</a>
        
              <a href="https://www.meteoblue.com/en/weather-api" target="_blank"  class="badge bg-primary">MeteoBlue</a>
        </p>

        <h6 class="fw-semibold">Libraries & Frameworks</h6>
         <a href="https://getbootstrap.com/" target="_blank" class="badge bg-secondary">Bootstrap 5
                            </a>
                            <a href="https://frappe.io/charts" target="_blank"  class="badge bg-secondary">Frappe Charts
                            </a>
                            <a href="https://mdbootstrap.com/docs/standard/extended/weather" target="_blank"  class="badge bg-secondary">mdbootstrap
                            </a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

   
    <script src="scripts/indexscript.js"></script>
</body>
</html>
